name = "khhan-com"

# Cloudflare Pages 프로젝트의 빌드 산출물 위치.
# 이 키가 있으면 `wrangler pages dev` 를 인자 없이 실행할 수 있다.
pages_build_output_dir = "dist"

# 날짜를 고정한다. 비워 두면 wrangler 가 "오늘"로 잡는데,
# 로컬 workerd 바이너리가 그 날짜를 아직 지원하지 않으면 런타임이 뜨지 않는다.
compatibility_date = "2026-08-01"

# Astro 어댑터가 Node 내장 모듈(node:buffer 등)을 참조하므로 필요하다.
compatibility_flags = ["nodejs_compat"]
