intro: |-
  KAIST 전기및전자공학 전공으로 학사·석사·박사 학위를 받았습니다. 박사과정에서는 양자 컴퓨팅의 원리를 진화 알고리즘에 접목한 QEA(Quantum-inspired Evolutionary Algorithm)를 제안했습니다.

  삼성전자 DMC연구소에서 책임·수석연구원으로 일했고, 미국 산호세의 User Experience Center America에서 디렉터를 지냈습니다. 그 사이 MIT 미디어랩에서 방문연구원으로 있었습니다.

  2013년 삼영기계에 합류해 2018년부터 사장 겸 연구소장을 맡고 있습니다. 샌드 3D 프린팅으로 주조 공정을 디지털화하는 일을 이끌고 있으며, 순천향대학교와 호서대학교에서 스마트팩토리와 AI 전환(AX)을 가르칩니다.
